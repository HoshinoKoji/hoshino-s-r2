# Non-secret synthetic values for deploy --dry-run; never deploy this fixture.
[worker]
name = "cdlab-r2-dry-run"
account_id = "11111111111111111111111111111111"
workers_dev = false
preview_urls = false

[[worker.routes]]
pattern = "files.example.com"
custom_domain = true

[access]
team_domain = "https://example.cloudflareaccess.com"
audience = "2222222222222222222222222222222222222222222222222222222222222222"

[[buckets]]
id = "documents"
label = "文档"
binding = "R2_DOCUMENTS"
bucket_name = "example-documents"

[[buckets]]
id = "archives"
label = "归档"
binding = "R2_ARCHIVES"
bucket_name = "example-archives"
