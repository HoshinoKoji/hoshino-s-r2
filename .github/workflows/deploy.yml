name: Deploy
on:
  workflow_dispatch:
    inputs:
      override:
        description: Fork TOML override path
        required: true
        default: deploy.override.toml
permissions:
  contents: read
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run deploy -- --override "$OVERRIDE_PATH"
        env:
          OVERRIDE_PATH: ${{ inputs.override }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WRANGLER_SEND_METRICS: 'false'
